<!doctype html>

<style>
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:#0b0b0b;color:#f6f1e8;font-family:Arial,Helvetica,sans-serif;min-height:100svh;display:flex;flex-direction:column;position:relative;overflow-x:hidden}body:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 75% 20%,#94733a17,transparent 55%),radial-gradient(ellipse at 10% 90%,#94733a0c,transparent 60%)}header,footer{position:relative;display:flex;align-items:center;justify-content:space-between;padding:32px clamp(24px,6vw,100px)}header{border-bottom:1px solid #ffffff0d}.brand{font-family:Georgia,serif;font-size:24px;letter-spacing:.14em;color:#d5b67b}.status{font-size:10px;letter-spacing:.2em;color:#a29b8f;display:flex;gap:10px;align-items:center}.status:before{content:"";height:5px;width:5px;background:#d5b67b;border-radius:50%;box-shadow:0 0 12px #d5b67555}main{position:relative;flex:1;display:grid;place-content:center;text-align:center;padding:80px 24px 100px;min-height:570px}.eyebrow{color:#c3a779;font-size:10px;letter-spacing:.35em;text-transform:uppercase;margin:0 0 35px}.ornament{width:1px;height:56px;background:linear-gradient(transparent,#bca16c);margin:0 auto 34px}h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(65px,10vw,145px);letter-spacing:-.055em;line-height:1.04;margin:0}h1 em{font-weight:400;color:#d5b67b}p.copy{max-width:380px;margin:28px auto 0;color:#9b978f;font-size:15px;line-height:1.8}.signature{margin-top:45px;font-size:10px;letter-spacing:.25em;color:#b6a17c}footer{border-top:1px solid #ffffff0d;font-size:10px;letter-spacing:.09em;color:#77746e;gap:20px}footer a{color:#b9ac94;text-decoration:none}footer a:hover{color:#ead7b0}a:focus-visible{outline:2px solid #d5b67b;outline-offset:6px}@media(max-width:600px){header,footer{padding:24px}.brand{font-size:19px}.status{font-size:8px;letter-spacing:.13em}main{min-height:480px;padding:65px 24px}footer{flex-wrap:wrap;line-height:1.6}.eyebrow{font-size:9px}p.copy{font-size:14px}}@media(prefers-reduced-motion:no-preference){main{animation:arrive 1s ease both}@keyframes arrive{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}}
</style>
</head>
